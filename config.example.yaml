# Optional settings file. Copy it to config.yaml (ignored by git), edit, and pass it with
#   python main.py --sites sites.txt --config config.yaml
# Nothing is read unless --config is given. A command-line option wins over this file; this file
# wins over the built-in default. The values below are the defaults. Keys not listed here are
# ignored (the run log lists them under config_keys_ignored).

# Seconds between two requests to the same host. If a site's robots.txt sets a longer
# Crawl-delay, the longer one is used for that host.
rate_limit_delay: 1.5

# Seconds to wait for one HTTP response (--timeout).
timeout: 30

# HTML pages read per site, homepage included; sitemap files are not counted (--max-pages).
max_pages: 20

# Products collected per site; once reached, the remaining product and collection pages are
# skipped and the policy pages are still read (--max-products).
max_products: 50

# Products taken from one collection page, so that one big collection does not fill the whole
# sample; the homepage's product cards and products.json count as one collection each
# (--max-per-collection).
max_products_per_collection: 10

# Render pages in a headless browser (--render-js). Needs `playwright install chromium`.
render_js: false

# Fetch pages that robots.txt disallows and ignore its Crawl-delay (--ignore-robots).
ignore_robots: false

# SQLite file where every scan is stored; --monitor compares a scan with the previous one here.
db_path: data/intel_cache.db
